# Optional: builds the game and publishes it to GitHub Pages on every push to `main`.
#
# One-time setup:
#   Repo → Settings → Pages → Source → "GitHub Actions"
#
# Don't want auto-deploys? Just delete this file (or the whole .github/ folder).
# Note: `npm install` is used instead of `npm ci` because no lockfile is committed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time, and don't cancel an in-flight deploy mid-run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The build is a single self-contained dist/index.html, so no base-path
      # rewriting is needed — it works from any Pages subpath as-is.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
